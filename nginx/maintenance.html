<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الشنتف للعقار والاستثمار</title>
  <style>
    :root {
      --green: #f7f7f7;
      --gold: #caa064;
      --ink-soft: #61707a
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--green), #0b2622);
      color: #fff;
      font-family: "IBM Plex Sans Arabic", Tahoma, Arial, sans-serif;
      text-align: center;
      padding: 24px
    }

    .card {
      max-width: 440px
    }

    img {
      width: 88px;
      height: 88px;
      margin-bottom: 22px
    }

    h1 {
      font-size: 22px;
      margin: 0 0 10px
    }

    p {
      color: rgba(255, 255, 255, .75);
      line-height: 1.9;
      font-size: 14px;
      margin: 0 0 6px
    }

    .en {
      color: rgba(255, 255, 255, .5);
      font-size: 12px;
      margin-top: 14px
    }
  </style>
</head>
