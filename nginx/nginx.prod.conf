server {
    listen 80;
    server_name alshantaf.com www.alshantaf.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Canonicalize www -> apex domain (avoids duplicate-content indexing of two hosts).
server {
    listen 443 ssl;
    http2 on;
    server_name www.alshantaf.com;

    ssl_certificate /etc/letsencrypt/live/alshantaf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alshantaf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://alshantaf.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name alshantaf.com;
    client_max_body_size 130m;
    client_body_timeout 300s;

    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/alshantaf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alshantaf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.openstreetmap.org https://server.arcgisonline.com https://*.arcgisonline.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com https://*.cloudflareinsights.com https://challenges.cloudflare.com https://maps.dls.gov.jo; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /etc/nginx/html;
        internal;
    }

    location /uploads/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:4000;
        proxy_set_header Host $host;
        expires 30d;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Allow first-party embedded viewing of uploaded PDFs inside offer pages.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; frame-ancestors 'self'" always;
    }

    # Long-cache hashed Next.js build assets
    location /_next/static/ {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Optimized public images / fonts
    location ~* ^/(hero-|industrial-|logo-|gov/).*\.(webp|avif|png|jpe?g|svg|woff2)$ {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /api/admin/uploads {
        set $backend_host backend;
        proxy_pass http://$backend_host:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 0;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        client_max_body_size 130m;
    }

    location / {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Buffer HTML so TTFB stays low under load
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 24k;
    }
}


# ===== alwathbasteelfiber.com (W Steel Fiber) =====
server {
    listen 80;
    server_name alwathbasteelfiber.com www.alwathbasteelfiber.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://alwathbasteelfiber.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.alwathbasteelfiber.com;

    ssl_certificate /etc/letsencrypt/live/alwathbasteelfiber.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alwathbasteelfiber.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://alwathbasteelfiber.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name alwathbasteelfiber.com;
    client_max_body_size 64m;

    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/alwathbasteelfiber.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alwathbasteelfiber.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self) required for Business Inbox voice notes
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    location /api/admin/ws {
        set $wsteelfiber_host wsteelfiber-app;
        proxy_pass http://$wsteelfiber_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Shared customer order receipts (Alshantaf backend + Next public page)
    location /api/public/orders/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
    }

    location /o/ {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Receipt pages are Alshantaf Next.js; their /_next assets must hit the same frontend
    # (not wsteelfiber), or the page sticks on "جاري التحميل…".
    location /_next/ {
        set $frontend_host frontend;
        proxy_pass http://$frontend_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        set $wsteelfiber_host wsteelfiber-app;
        proxy_pass http://$wsteelfiber_host:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 24k;
    }
}

# First Order — nginx for altalab-alawal.com (canonical = apex, no www)

# ===== altalab-alawal.com (First Order / الطلب الأول) =====
server {
    listen 80;
    server_name altalab-alawal.com www.altalab-alawal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://altalab-alawal.com$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.altalab-alawal.com;

    ssl_certificate /etc/letsencrypt/live/altalab-alawal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altalab-alawal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://altalab-alawal.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name altalab-alawal.com;
    client_max_body_size 10m;

    root /var/www/firstorder;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    ssl_certificate /etc/letsencrypt/live/altalab-alawal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altalab-alawal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        set $firstorder_api firstorder-api;
        proxy_pass http://$firstorder_api:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /logos/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location /icons/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
